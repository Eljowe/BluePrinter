name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only the newest run for a given branch/PR matters; cancel stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned so CI is reproducible. Bump deliberately, not by accident.
env:
  JUCE_VERSION: "8.0.15"
  # Matches the version JUCE 8.0.15's FindWebView2.cmake suggests.
  WEBVIEW2_VERSION: "1.0.3485.44"

jobs:
  build:
    name: Build (Windows, Release)
    runs-on: windows-latest

    steps:
      - name: Checkout BluePrinter
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      - name: Build WebUI
        working-directory: WebUI
        run: |
          npm ci
          npm run build

      # JUCE does not download the WebView2 SDK itself: FindWebView2.cmake
      # looks in the local NuGet package folder. Fetch it into a known dir and
      # point CMake at it so the runner doesn't depend on a preinstalled copy.
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'webview2'
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget
          } else {
            $nuget = 'nuget'
          }
          & $nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory $dest `
            -Source https://api.nuget.org/v3/index.json `
            -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JUCE_WEBVIEW2_PACKAGE_LOCATION=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Cache the JUCE checkout keyed on the pinned version. On a cache hit the
      # checkout below is skipped and the restored tree is used as-is.
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}

      - name: Checkout JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: juce
          fetch-depth: 1

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DJUCE_DIR="${{ github.workspace }}/juce" `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:JUCE_WEBVIEW2_PACKAGE_LOCATION"

      - name: Build (Release)
        run: >
          cmake --build build --config Release
          --target BluePrinter_Standalone BluePrinter_VST3

      # ---------------------------------------------------------------------
      # Tests (ticket 0012). Uncomment once the CTest harness and tests land.
      # - name: Run tests
      #   run: ctest --test-dir build -C Release --output-on-failure
      # ---------------------------------------------------------------------

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: BluePrinter-Standalone
          path: build/BluePrinter_artefacts/Release/Standalone/BluePrinter.exe
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BluePrinter-VST3
          path: build/BluePrinter_artefacts/Release/VST3/BluePrinter.vst3
          if-no-files-found: error
