name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only the newest run for a given branch/PR matters; cancel stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned so CI is reproducible. Bump deliberately, not by accident.
env:
  JUCE_VERSION: "8.0.14"
  # Matches the version JUCE 8.0.14's FindWebView2.cmake suggests.
  WEBVIEW2_VERSION: "1.0.3485.44"

jobs:
  build:
    name: Build (Windows, Release)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout BluePrinter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      - name: Build WebUI
        working-directory: WebUI
        run: |
          npm ci
          npm run build

      # JUCE does not download the WebView2 SDK itself: FindWebView2.cmake
      # looks in the local NuGet package folder. Fetch it into a known dir and
      # point CMake at it so the runner doesn't depend on a preinstalled copy.
      # The CLI is pinned to a verified version (not /latest/) so the tool
      # itself can't change under the build.
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'webview2'
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/v6.11.1/nuget.exe' -OutFile $nuget
          } else {
            $nuget = 'nuget'
          }
          & $nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory $dest `
            -Source https://api.nuget.org/v3/index.json `
            -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JUCE_WEBVIEW2_PACKAGE_LOCATION=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Cache the JUCE checkout keyed on the pinned version + patch revision.
      # Bump the "-p1" suffix when the patch in cmake/patches/ changes.
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}-p1

      - name: Checkout JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: juce
          fetch-depth: 1

      # The project builds against a patched JUCE: this adds
      # WinWebView2::withAdditionalBrowserArguments, used by WebViewEditor.cpp to
      # pass --allow-no-sandbox-job --disable-gpu. A cached tree is already
      # patched, so only a fresh checkout needs it.
      - name: Apply JUCE patches
        shell: pwsh
        run: |
          $header = 'juce/modules/juce_gui_extra/misc/juce_WebBrowserComponent.h'
          if (Select-String -Path $header -Pattern 'withAdditionalBrowserArguments' -Quiet) {
            Write-Host 'JUCE patches already applied (cache hit).'
          } else {
            git -C juce apply "${{ github.workspace }}/cmake/patches/juce-webview2-additional-args.patch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Set up the MSVC toolchain (cl.exe/link.exe on PATH) so Ninja can build.
      # Using Ninja instead of the "Visual Studio NN YYYY" generator keeps CI
      # working when GitHub swaps the VS version on windows-latest (it moved to
      # VS 2026 in mid-2026, which broke the pinned VS 2022 generator).
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DJUCE_DIR="${{ github.workspace }}/juce" `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:JUCE_WEBVIEW2_PACKAGE_LOCATION"

      - name: Build (Release)
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload standalone
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BluePrinter-Standalone
          path: build/BluePrinter_artefacts/Release/Standalone/BluePrinter.exe
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BluePrinter-VST3
          path: build/BluePrinter_artefacts/Release/VST3/BluePrinter.vst3
          if-no-files-found: error

  # ============================================================================
  # Cross-platform builds (ADR-0006 / ticket 0042). These mirror the Windows
  # job: build the WebUI, check out the pinned JUCE, build Release, run ctest.
  # The local WebView2 patch is Windows-only and is not applied here; the
  # editor selects WKWebView / WebKitGTK via JUCE's default backend.
  # ============================================================================
  build-macos:
    name: Build (macOS, Release)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout BluePrinter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      - name: Build WebUI
        working-directory: WebUI
        run: |
          npm ci
          npm run build

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}-p1

      - name: Checkout JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: juce
          fetch-depth: 1

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_DIR="${{ github.workspace }}/juce"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # Package the unsigned .dmg (ticket 0044) so the release script is
      # machine-checked on every push, and upload it as an artifact.
      - name: Package (unsigned .dmg)
        run: bash installer/build-macos-release.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BluePrinter-macOS
          path: build/release/*-macos/BluePrinter-*.dmg
          if-no-files-found: error

  build-linux:
    name: Build (Linux, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout BluePrinter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      - name: Build WebUI
        working-directory: WebUI
        run: |
          npm ci
          npm run build

      # JUCE's Linux build needs the X11/ALSA/FreeType/GL headers and the
      # WebKitGTK 4.1 development package that backs Backend::webkitgtk.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev \
            librsvg2-bin

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}-p1

      - name: Checkout JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: juce
          fetch-depth: 1

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_DIR="${{ github.workspace }}/juce"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # Package the .deb + AppImage (ticket 0045) so the release script is
      # machine-checked on every push, and upload them as artifacts.
      - name: Package (.deb + AppImage)
        run: bash installer/build-linux-release.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BluePrinter-Linux
          path: |
            build/release/*-linux/BluePrinter-*.deb
            build/release/*-linux/BluePrinter-*.AppImage
          if-no-files-found: error

  # ============================================================================
  # AddressSanitizer + UndefinedBehaviorSanitizer run of the pure-logic suite.
  #
  # Scope is deliberately the TEST TARGET only (no WebView, no plugin host, no
  # audio device), so the build stays fast enough for every push. It exercises
  # the Phase-1 lifetime changes (retired chains/slots, the MIDI send queue,
  # looper/take buffers) under ASan/UBSan.
  #
  # Advisory for now: JUCE's own header-only/utility code (and the tests'
  # deliberately-crashing cases) can trip sanitizers for reasons outside this
  # repo, so a red run is a signal to investigate, not a release gate. Drop
  # `continue-on-error` once the job has been green for a while.
  # ============================================================================
  build-linux-sanitizers:
    name: Tests (Linux, ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout BluePrinter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev \
            librsvg2-bin

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}-p1

      - name: Checkout JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: juce
          fetch-depth: 1

      - name: Configure CMake (Debug + sanitizers)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DJUCE_DIR="${{ github.workspace }}/juce"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build --target BluePrinterTests -j 2

      # Leak detection stays off: JUCE's singletons and the test harness keep
      # process-lifetime objects alive, which would report as leaks.
      - name: Run tests under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build -R '^BluePrinterTests$' --output-on-failure
