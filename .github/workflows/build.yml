name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only the newest run for a given branch/PR matters; cancel stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned so CI is reproducible. Bump deliberately, not by accident.
env:
  JUCE_VERSION: "8.0.14"
  # Matches the version JUCE 8.0.14's FindWebView2.cmake suggests.
  WEBVIEW2_VERSION: "1.0.3485.44"

jobs:
  build:
    name: Build (Windows, Release)
    runs-on: windows-latest

    steps:
      - name: Checkout BluePrinter
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      - name: Build WebUI
        working-directory: WebUI
        run: |
          npm ci
          npm run build

      # JUCE does not download the WebView2 SDK itself: FindWebView2.cmake
      # looks in the local NuGet package folder. Fetch it into a known dir and
      # point CMake at it so the runner doesn't depend on a preinstalled copy.
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'webview2'
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget
          } else {
            $nuget = 'nuget'
          }
          & $nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory $dest `
            -Source https://api.nuget.org/v3/index.json `
            -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JUCE_WEBVIEW2_PACKAGE_LOCATION=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Cache the JUCE checkout keyed on the pinned version + patch revision.
      # Bump the "-p1" suffix when the patch in cmake/patches/ changes.
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}-p1

      - name: Checkout JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: juce
          fetch-depth: 1

      # The project builds against a patched JUCE: this adds
      # WinWebView2::withAdditionalBrowserArguments, used by WebViewEditor.cpp to
      # pass --allow-no-sandbox-job --disable-gpu. A cached tree is already
      # patched, so only a fresh checkout needs it.
      - name: Apply JUCE patches
        shell: pwsh
        run: |
          $header = 'juce/modules/juce_gui_extra/misc/juce_WebBrowserComponent.h'
          if (Select-String -Path $header -Pattern 'withAdditionalBrowserArguments' -Quiet) {
            Write-Host 'JUCE patches already applied (cache hit).'
          } else {
            git -C juce apply "${{ github.workspace }}/cmake/patches/juce-webview2-additional-args.patch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Set up the MSVC toolchain (cl.exe/link.exe on PATH) so Ninja can build.
      # Using Ninja instead of the "Visual Studio NN YYYY" generator keeps CI
      # working when GitHub swaps the VS version on windows-latest (it moved to
      # VS 2026 in mid-2026, which broke the pinned VS 2022 generator).
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DJUCE_DIR="${{ github.workspace }}/juce" `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:JUCE_WEBVIEW2_PACKAGE_LOCATION"

      - name: Build (Release)
        run: cmake --build build

      # ---------------------------------------------------------------------
      # Tests (ticket 0012). Uncomment once the CTest harness and tests land.
      # - name: Run tests
      #   run: ctest --test-dir build --output-on-failure
      # ---------------------------------------------------------------------

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: BluePrinter-Standalone
          path: build/BluePrinter_artefacts/Release/Standalone/BluePrinter.exe
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BluePrinter-VST3
          path: build/BluePrinter_artefacts/Release/VST3/BluePrinter.vst3
          if-no-files-found: error
